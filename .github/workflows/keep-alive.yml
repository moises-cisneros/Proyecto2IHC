name: Keep Alive Render

on:
    schedule:
        # Pings every 10 minutes to prevent cold starts on Render Free Tier
        - cron: '*/10 * * * *'
    workflow_dispatch:

concurrency:
    group: keep-alive
    cancel-in-progress: true

jobs:
    ping:
        name: Keep Render Warm
        runs-on: ubuntu-latest
        timeout-minutes: 2

        steps:
            - name: Ping Planazo Health Check
              env:
                  RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
              run: |
                  curl -sSf -m 15 "$RENDER_APP_URL/up" || curl -sSf -m 15 "$RENDER_APP_URL/" || true
