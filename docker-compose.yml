# ============================================================
#  Planazo — Docker Compose (desarrollo)
#  Comando: npm run docker:dev
# ============================================================

services:

  # ── Aplicación Laravel (PHP 8.2) ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planazo_app
    ports:
      - "9300:8000"
    volumes:
      - .:/var/www/html          # Hot-reload: cambios en código se reflejan
      - vendor_data:/var/www/html/vendor  # vendor en volumen separado
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: Planazo
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:9300
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: proyecto2ihc
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    networks:
      - planazo_net
    restart: unless-stopped

  # ── MySQL 8.0 ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: planazo_mysql
    ports:
      - "9306:3306"
    environment:
      MYSQL_DATABASE: proyecto2ihc
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - planazo_net
    restart: unless-stopped

  # ── Vite (Node 24 — HMR / Tailwind) ──────────────────────
  vite:
    image: node:24-alpine
    container_name: planazo_vite
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules  # node_modules en volumen separado
    ports:
      - "9373:9373"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 9373"
    networks:
      - planazo_net
    restart: unless-stopped

# ── Volúmenes persistentes ────────────────────────────────────
volumes:
  mysql_data:
  vendor_data:
  node_modules_data:

# ── Red interna ───────────────────────────────────────────────
networks:
  planazo_net:
    driver: bridge
